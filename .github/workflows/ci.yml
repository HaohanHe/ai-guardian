name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 的新运行取消旧运行，省额度（tag 发布不受影响：tag 名唯一）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================
  # Node / TypeScript：当前主要维护的运行时（含 Linux 实时防御）
  # =========================================================
  node-ci:
    name: Node CI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Package built runtime (Node 20 only)
        if: matrix.node == '20'
        run: tar -czf ai-guardian-node-dist.tar.gz -C dist .

      - name: Upload runtime artifact (Node 20 only)
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: node-dist
          path: ai-guardian-node-dist.tar.gz
          if-no-files-found: error

  # =========================================================
  # Rust 质量门：格式 + clippy
  # =========================================================
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy (-D warnings)
        run: cargo clippy --release -- -D warnings

  # =========================================================
  # Rust 构建：Linux amd64 / arm64 / Windows
  # =========================================================
  rust-build:
    name: Rust Build (${{ matrix.name-suffix }})
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/ai-guardian
            name-suffix: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: target/aarch64-unknown-linux-gnu/release/ai-guardian
            name-suffix: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: target/x86_64-pc-windows-msvc/release/ai-guardian.exe
            name-suffix: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' \
            >> .cargo/config.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test (linux amd64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.name-suffix }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # =========================================================
  # eBPF：真实编译骨架为 BPF 对象（CORE：只需 BTF + libbpf 头）
  # =========================================================
  ebpf:
    name: eBPF Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / libbpf
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev

      - name: Install bpftool (generic + HWE, whichever exists)
        run: |
          sudo apt-get install -y linux-tools-generic || true
          sudo apt-get install -y linux-tools-generic-hwe-24.04 || true
          sudo apt-get install -y linux-tools-generic-hwe-22.04 || true

      - name: Resolve newest bpftool binary
        id: resolve-bpftool
        run: |
          # Ubuntu 的 bpftool 按内核版本分发，运行内核（azure）常无对应包；
          # 取 /usr/lib/linux-tools 下版本最高的真实二进制，
          # BTF dump 只读文件，与运行内核无关
          BIN="$(ls /usr/lib/linux-tools/*/bpftool 2>/dev/null | sort -V | tail -1)"
          test -n "$BIN"
          echo "Using bpftool: $BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Build eBPF object
        run: >
          make -C driver/linux LINUX_HEADERS=/usr
          BPFTOOL=${{ steps.resolve-bpftool.outputs.path }}

      - name: Upload eBPF object
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-object
          path: driver/linux/ai_guardian.bpf.o
          if-no-files-found: error

  # =========================================================
  # Electron UI：lint / test / build（产物落在根 dist/main、dist/renderer）
  # =========================================================
  ui:
    name: Electron UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Test
        working-directory: ui
        run: npm test -- --run

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Upload UI build
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.os }}
          path: |
            ui/dist/main
            ui/dist/renderer
          if-no-files-found: error

  # =========================================================
  # CD：打 v* tag 时创建 GitHub Release（预发布）
  # =========================================================
  release:
    name: Create Release
    needs: [node-ci, rust-build, ebpf, ui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare versioned files
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # 原生二进制（平台后缀）
          cp artifacts/rust-linux-amd64/ai-guardian "ai-guardian-${TAG}-linux-amd64"
          cp artifacts/rust-linux-arm64/ai-guardian "ai-guardian-${TAG}-linux-arm64"
          cp artifacts/rust-windows-amd64/ai-guardian.exe "ai-guardian-${TAG}-windows-amd64.exe"
          chmod +x "ai-guardian-${TAG}-linux-amd64" "ai-guardian-${TAG}-linux-arm64"

          # Node/TS 运行时整包（artifact 下载后是解压目录，重新打包）
          tar -czf "ai-guardian-node-${TAG}.tar.gz" -C artifacts/node-dist .

          # eBPF 对象
          cp artifacts/ebpf-object/ai_guardian.bpf.o "ai-guardian-${TAG}.bpf.o"

          # UI 构建整包
          tar -czf "ai-guardian-ui-${TAG}.tar.gz" -C artifacts/ui-ubuntu-latest .

          # Debian 包（amd64）
          mkdir -p deb/DEBIAN deb/usr/bin
          cp artifacts/rust-linux-amd64/ai-guardian deb/usr/bin/ai-guardian
          chmod 755 deb/usr/bin/ai-guardian
          {
            echo "Package: ai-guardian"
            echo "Version: ${VER}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: Haohan He <hehaohan@hsyscn.top>"
            echo "Description: Runtime guard for AI coding agents"
            echo " Watches AI agent processes and can suspend or stop them."
          } > deb/DEBIAN/control
          dpkg-deb --build --root-owner-group deb "ai-guardian_${VER}_amd64.deb"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "AI Guardian ${TAG}" \
            --generate-notes \
            --prerelease \
            "ai-guardian-${TAG}-linux-amd64" \
            "ai-guardian-${TAG}-linux-arm64" \
            "ai-guardian-${TAG}-windows-amd64.exe" \
            "ai-guardian-node-${TAG}.tar.gz" \
            "ai-guardian-${TAG}.bpf.o" \
            "ai-guardian-ui-${TAG}.tar.gz" \
            "ai-guardian_${TAG#v}_amd64.deb"
